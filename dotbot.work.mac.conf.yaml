# linux/mac
- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    # vim 配置
    ~/.vimrc: home/.vimrc
    # idea 配置
    ~/.ideavimrc: home/.ideavimrc
    # zshrc 配置 {env:环境}.{device:设备}.{文件名}
    ~/.zshrc: shell/work.mac.zshrc
    ~/.p10k.zsh: shell/.p10k.zsh
    # linux / macos 专属
    ~/.config/nvim: nvim
    # uv 配置
    ~/.config/uv/uv.toml: home/uv.toml
    # Rime 配置
    ~/Library/Rime/default.custom.yaml:
      path: rime-custom/default.custom.yaml
    ~/Library/Rime/squirrel.custom.yaml:
      path: rime-custom/squirrel.custom.yaml
    ~/Library/Rime/custom_phrase.txt: rime-custom/custom_phrase.txt
    ~/Library/Rime:
      glob: true
      path: rime-ice/*
      exclude:
        - .git*
        - "**/custom_phrase.txt"
        - .*custom.yaml
